    <!-- waveform -->
    <g fill="url(#accent)">
      <rect x="940" y="216" width="7" height="18" rx="3.5"/>
      <rect x="956" y="206" width="7" height="38" rx="3.5"/>
      <rect x="972" y="192" width="7" height="66" rx="3.5"/>
      <rect x="988" y="176" width="7" height="98" rx="3.5"/>
      <rect x="1004" y="196" width="7" height="58" rx="3.5"/>
      <rect x="1020" y="160" width="7" height="130" rx="3.5"/>
      <rect x="1036" y="186" width="7" height="78" rx="3.5"/>
      <rect x="1052" y="204" width="7" height="42" rx="3.5"/>
      <rect x="1068" y="170" width="7" height="110" rx="3.5"/>
      <rect x="1084" y="198" width="7" height="54" rx="3.5"/>
      <rect x="1100" y="212" width="7" height="26" rx="3.5"/>
      <rect x="1116" y="188" width="7" height="74" rx="3.5"/>
      <rect x="1132" y="176" width="7" height="98" rx="3.5"/>
      <rect x="1148" y="200" width="7" height="50" rx="3.5"/>
      <rect x="1164" y="214" width="7" height="22" rx="3.5"/>
      <rect x="1180" y="192" width="7" height="66" rx="3.5"/>
      <rect x="1196" y="182" width="7" height="86" rx="3.5"/>
      <rect x="1212" y="206" width="7" height="38" rx="3.5"/>
      <rect x="1228" y="214" width="7" height="22" rx="3.5"/>
      <rect x="1244" y="196" width="7" height="58" rx="3.5"/>
      <rect x="1260" y="208" width="7" height="34" rx="3.5"/>
      <rect x="1276" y="218" width="7" height="14" rx="3.5"/>
      <rect x="1292" y="202" width="7" height="46" rx="3.5"/>
      <rect x="1308" y="212" width="7" height="26" rx="3.5"/>
      <rect x="1324" y="204" width="7" height="42" rx="3.5"/>
      <rect x="1340" y="216" width="7" height="18" rx="3.5"/>
    </g>
    <!-- play button -->
    <circle cx="1180" cy="300" r="34" fill="#ffffff" fill-opacity="0.12" stroke="#ffffff" stroke-opacity="0.5" stroke-width="2"/>
    <path d="M 1170 282 L 1198 300 L 1170 318 Z" fill="#ffffff"/>
    <!-- progress -->
    <rect x="930" y="352" width="500" height="6" rx="3" fill="#2a3560"/>
    <rect x="930" y="352" width="330" height="6" rx="3" fill="url(#accent)"/>
    <!-- subtitle bars -->
    <rect x="930" y="370" width="200" height="12" rx="6" fill="#ffffff" fill-opacity="0.85"/>
    <rect x="1140" y="370" width="150" height="12" rx="6" fill="#ffffff" fill-opacity="0.45"/>
